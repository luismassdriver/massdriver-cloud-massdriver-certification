services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mdcert
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mdcert
      AUTH_SECRET: local-dev-secret-change-me
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      AUTH_DEV_LOGIN: "true"
    depends_on:
      - db
volumes:
  pgdata:
